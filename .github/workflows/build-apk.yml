name: Build APK

# Builds the APK on GitHub's machines, so nothing needs to be installed locally.
# Start it from the Actions tab (Run workflow) or by pushing a commit.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the Android SDK
        uses: android-actions/setup-android@v3

      # The Gradle wrapper is not committed, so Gradle is installed directly here
      # rather than calling ./gradlew.
      - name: Install Gradle 9.6.0
        run: |
          curl -sSL -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-9.6.0-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-9.6.0/bin" >> "$GITHUB_PATH"

      - name: Build the debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload the APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
